<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rollout Knob | Simon Schreiber</title>
  <style>
    :root {
      --gap: 24px;
      --nav-width: 1024px;
      --header-height: 60px;
      --primary: rgb(30, 30, 30);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
        Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      font-size: 18px;
      line-height: 1.6;
      background: #fff;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .header {
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    body.light-bg .header {
      color: var(--primary);
    }

    body.dark-bg .header {
      color: #fff;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      max-width: calc(var(--nav-width) + var(--gap) * 2);
      margin-inline: auto;
      line-height: var(--header-height);
    }

    .logo {
      display: flex;
      margin: auto var(--gap);
    }

    .logo a {
      display: block;
      font-size: 24px;
      font-weight: 700;
    }

    .logo a img {
      display: inline;
      vertical-align: middle;
      pointer-events: none;
      transform: translate(0, -10%);
      border-radius: 6px;
      margin-inline-end: 8px;
      height: 35px;
    }

    #menu {
      display: flex;
      list-style: none;
      margin: auto var(--gap);
      overflow-x: auto;
      white-space: nowrap;
    }

    #menu li + li {
      margin-inline-start: var(--gap);
    }

    #menu a {
      display: block;
      font-size: 16px;
    }

    #menu a:hover {
      opacity: 0.75;
    }

    .rollout-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f5f5f5;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    body.dark-bg .rollout-main {
      color: #fff;
    }

    body.light-bg .rollout-main {
      color: var(--primary);
    }

    .rollout-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    #percentage {
      font-size: clamp(6rem, 25vw, 14rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    #label {
      margin-top: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.35em;
      opacity: 0.85;
    }

    #status {
      padding: 1rem 1.5rem 1.5rem;
      font-size: 0.875rem;
      opacity: 0.75;
      text-align: center;
    }
  </style>
</head>
<body class="light-bg">
  <header class="header" id="header">
    <nav class="nav">
      <div class="logo">
        <a href="https://www.sischreiber.com/" title="Simon Schreiber">
          <img src="https://www.sischreiber.com/apple-touch-icon.png" alt="" height="35">
          Simon Schreiber
        </a>
      </div>
      <ul id="menu">
        <li><a href="https://www.sischreiber.com/projects/"><span>Projects</span></a></li>
        <li><a href="https://www.sischreiber.com/posts/"><span>Posts</span></a></li>
        <li><a href="https://www.sischreiber.com/about/"><span>About</span></a></li>
      </ul>
    </nav>
  </header>

  <div class="rollout-main" id="rollout-main">
    <div class="rollout-content">
      <div id="percentage">0%</div>
      <div id="label">ROLLOUT</div>
    </div>
    <div id="status">Connecting…</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {
      getRemoteConfig,
      fetchAndActivate,
      getValue,
    } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-remote-config.js";

    import { firebaseConfig } from "./config.local.js";

    const percentageEl = document.getElementById("percentage");
    const statusEl = document.getElementById("status");
    const headerEl = document.getElementById("header");
    const rolloutMainEl = document.getElementById("rollout-main");
    const REMOTE_CONFIG_KEY = "rollout_percentage";

    function rolloutColor(p) {
      const value = Math.max(0, Math.min(100, Number(p) || 0));
      if (value <= 0) {
        return { background: "#f5f5f5", light: true };
      }

      const t = value / 100;
      const hue = 120;
      const saturation = t * 65;
      const lightness = 96 - t * 51;

      return {
        background: `hsl(${hue}, ${saturation}%, ${lightness}%)`,
        light: lightness > 55,
      };
    }

    function updateDisplay(value) {
      const p = Math.round(Math.max(0, Math.min(100, Number(value) || 0)));
      const { background, light } = rolloutColor(p);

      percentageEl.textContent = `${p}%`;
      headerEl.style.backgroundColor = background;
      rolloutMainEl.style.backgroundColor = background;
      document.body.classList.toggle("light-bg", light);
      document.body.classList.toggle("dark-bg", !light);
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    const app = initializeApp(firebaseConfig);
    const rc = getRemoteConfig(app);

    rc.settings.minimumFetchIntervalMillis = 0;
    rc.defaultConfig = { [REMOTE_CONFIG_KEY]: 0 };

    async function refreshRollout() {
      try {
        await fetchAndActivate(rc);
        const value = getValue(rc, REMOTE_CONFIG_KEY).asNumber();
        updateDisplay(value);
        setStatus(
          `Firebase Remote Config · ${firebaseConfig.projectId} · ${REMOTE_CONFIG_KEY} · Last updated: ${new Date().toLocaleString()}`
        );
      } catch (error) {
        setStatus(`Error: ${error.message}`);
      }
    }

    refreshRollout();
    setInterval(refreshRollout, 10_000);
  </script>
</body>
</html>
